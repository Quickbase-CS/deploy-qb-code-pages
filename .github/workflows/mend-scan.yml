name: Mend Security Scan

on:
  push:
    branches: [main, feature/mend-scanning]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly, Monday 6am UTC
  workflow_dispatch:

jobs:
  mend-scan:
    name: Mend SAST & SCA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mend CLI
        run: |
          curl -fsSL https://downloads.mend.io/cli/linux_amd64/mend -o /usr/local/bin/mend
          chmod +x /usr/local/bin/mend

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "type=npm" >> $GITHUB_OUTPUT
          elif find . -maxdepth 4 -name "packages.config" | grep -q .; then
            echo "type=dotnet-legacy" >> $GITHUB_OUTPUT
          elif find . -maxdepth 4 -name "*.csproj" | grep -q .; then
            echo "type=dotnet" >> $GITHUB_OUTPUT
          else
            echo "type=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm install
        if: steps.detect.outputs.type == 'npm'
        run: npm install --ignore-scripts
        continue-on-error: true

      - name: Set branch name
        id: branch
        run: echo "name=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Mend SCA
        if: steps.detect.outputs.type == 'npm' || steps.detect.outputs.type == 'dotnet'
        env:
          MEND_URL: https://saas.mend.io
          MEND_EMAIL: quickbase-cs-mend@quickbase.com
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
        run: |
          mend dependencies \
            --scope "Quickbase-CS//${{ github.event.repository.name }}//${{ steps.branch.outputs.name }}" \
            --reachability \
            --update \
            --non-interactive

      - name: Mend SAST
        if: steps.detect.outputs.type != 'unknown'
        env:
          MEND_URL: https://saas.mend.io
          MEND_EMAIL: quickbase-cs-mend@quickbase.com
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
        run: |
          mend code \
            --scope "Quickbase-CS//${{ github.event.repository.name }}//${{ steps.branch.outputs.name }}" \
            --secrets-detection \
            --report \
            --formats sarif \
            --filename mend-sast \
            --non-interactive
